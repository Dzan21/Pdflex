# docker-compose.minio.yml
version: "3.9"

services:
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: pdflex-minio
    command: server --console-address ":9001" /data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - pdflex-net   # <— pripojíme do rovnakej siete

networks:
  pdflex-net:
    external: true
    name: pdflex-auth_default  # <— presne tento názov siete už máš

volumes:
  minio_data: